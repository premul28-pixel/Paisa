name: paisa
description: "PAISA – Offline Personal Finance Management Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  fl_chart: ^0.68.0
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.13.2
  crypto: ^3.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Icon & Splash Screen Generators
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/

# ==============================================================================
# FLUTTER LAUNCHER ICONS CONFIGURATION (Android Material 3 Adaptive Icons)
# ==============================================================================
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # Material 3 Adaptive Icon Configuration (Android 8.0+)
  adaptive_icon_background: "#10B981" # Emerald Green for Light theme
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ==============================================================================
# FLUTTER NATIVE SPLASH CONFIGURATION (Material 3 Light & Dark Mode)
# ==============================================================================
flutter_native_splash:
  color: "#10B981" # Primary Theme Emerald Green for Light Mode
  color_dark: "#0F172A" # Sleek Deep Slate for Dark Mode
  image: "assets/splash/splash_logo.png"
  image_dark: "assets/splash/splash_logo.png"
  branding: null
  color_transparent: false

  # Android 12+ Splash API Configuration
  android_12:
    color: "#10B981"
    color_dark: "#0F172A"
    image: "assets/splash/splash_logo.png"
    image_dark: "assets/splash/splash_logo.png"
    icon_background_color: "#10B981"
    icon_background_color_dark: "#0F172A"

  android: true
  ios: false
  web: false
